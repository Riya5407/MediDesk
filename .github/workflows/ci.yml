name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests (FastAPI & PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: Pharmacy_Management
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Initialize PostgreSQL Schema & Triggers
        run: |
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d Pharmacy_Management -f docs/db/pharmacy_schema.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d Pharmacy_Management -f docs/db/01_schema_fixes.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d Pharmacy_Management -f docs/db/02_triggers.sql

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run backend pytest suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/Pharmacy_Management
          ENVIRONMENT: development
          AUTH_ENABLED: true
          JWT_SECRET: ci-test-secret-key-that-is-at-least-32-chars-long!
          COOKIE_SECURE: false
        run: |
          cd backend
          pytest -v tests/

  frontend:
    name: Frontend Build & Tests (Vite & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript typecheck & production build
        run: |
          cd frontend
          npm run build

      - name: Run frontend unit & integration tests
        run: |
          cd frontend
          npm test

